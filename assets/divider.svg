<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="6" viewBox="0 0 1600 6">
  <rect x="0" y="2" width="1600" height="2" fill="#21262d"/>
  <rect x="-180" y="2" width="180" height="2" fill="#58a6ff" opacity="0.9">
    <animate attributeName="x" from="0" to="1600" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
